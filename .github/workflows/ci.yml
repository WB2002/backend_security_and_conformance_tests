name: CI & Self-Conformance Audit

on:
  push:
    branches: ["main", "master", "feat/*"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-self-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Go 1.27
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34
        with:
          go-version: "1.27"
          cache: false

      - name: Run go vet
        run: go vet ./...

      - name: Run test suite with race detector
        run: go test -race -v ./...

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: Build conformance-audit binary
        run: CGO_ENABLED=0 go build -o ./bin/conformance-audit ./cmd/conformance-audit

      - name: Dogfood supplychain and source-graph self-audit
        run: ./bin/conformance-audit --target . --stages supplychain,source-graph --mode local --output reports
